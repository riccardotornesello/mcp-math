# CI workflow for running tests, linting, formatting checks, and Docker build tests

name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Limit permissions to minimum required for security
permissions:
  contents: read

jobs:
  go-checks:
    name: Go Format, Lint and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Build
        run: go build -v ./...

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mcp-math:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
